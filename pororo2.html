tion answer(n){if(locked)return;if(n===quiz){locked=true;$('#feedback').textContent='🎉 정답이에요! 정말 잘했어요!';speak(`딩동댕! ${quiz}! 정말 잘했어요!`);for(let i=0;i<24;i++){let d=document.createElement('span');d.className='confetti';d.textContent=['⭐','🌈','💛','🎉'][i%4];d.style.left=(Math.random()*100)+'vw';d.style.animationDelay=(Math.random()*.4)+'s';document.body.append(d);setTimeout(()=>d.remove(),2300)}}else{$('#feedback').textContent='💖 조금만 더 세어 볼까요?';speak('괜찮아요! 친구들을 하나씩 세어 봐요.')}}$('#next').onclick=startQuiz;draw(3,false);startQuiz();</script></body></html>
